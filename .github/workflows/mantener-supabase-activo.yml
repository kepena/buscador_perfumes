# Los proyectos gratuitos de Supabase se pausan tras ~7 dias sin ninguna
# actividad. Si eso pasa, el test dejaria de leer los precios, fotos y
# activaciones del panel (seguiria funcionando, pero con los valores
# originales de data.js).
#
# Este trabajo hace una consulta minima cada 3 dias para que el proyecto
# nunca llegue a ese limite. Es gratis: consume unos segundos de GitHub
# Actions al mes.
#
# Requiere un secreto del repositorio llamado JERO_SUPABASE_KEY con la clave
# publica. Se configura en:
#   Settings -> Secrets and variables -> Actions -> New repository secret

name: Mantener Supabase activo

on:
  schedule:
    - cron: "0 12 */3 * *"   # cada 3 dias al mediodia UTC
  workflow_dispatch:          # permite lanzarlo a mano desde la pestana Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla de overrides
        run: |
          codigo=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.JERO_SUPABASE_KEY }}" \
            "https://evqifaeeamvrttuildkz.supabase.co/rest/v1/perfume_overrides?select=id&limit=1")
          echo "Supabase respondio HTTP $codigo"
          if [ "$codigo" != "200" ]; then
            echo "::error::La base de datos no respondio correctamente (HTTP $codigo)"
            exit 1
          fi
