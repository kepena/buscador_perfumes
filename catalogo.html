<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Panel — Kaiketek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="catalogo.css" />
</head>
<body>

  <!-- ============ PANTALLA DE ACCESO PROTEGIDO ============ -->
  <div id="pantalla-acceso" class="pantalla-acceso">
    <div class="acceso-card">
      <span class="acceso-icono">🔒</span>
      <h1 class="acceso-titulo">Acceso al catálogo</h1>
      <p class="acceso-sub">Esta sección es privada. Ingresa la contraseña para continuar.</p>
      <form id="form-acceso" class="acceso-form" autocomplete="off">
        <input
          type="password"
          id="input-clave-acceso"
          class="acceso-input"
          placeholder="Contraseña"
          autocomplete="new-password"
          autofocus
        />
        <button type="submit" class="acceso-boton">Entrar</button>
      </form>
      <p id="acceso-error" class="acceso-error" hidden>Contraseña incorrecta. Intenta de nuevo.</p>
    </div>
  </div>

  <div class="atmosfera" aria-hidden="true">
    <div class="mota mota-1"></div>
    <div class="mota mota-2"></div>
    <div class="mota mota-3"></div>
  </div>

  <div class="contenedor-catalogo" id="contenido-catalogo" hidden>

    <header class="catalogo-cabecera">
      <div class="marca">
        <span class="marca-icono">✦</span>
        <span class="marca-texto">Buscador de Perfumes <em>Pro</em></span>
      </div>
      <a href="index.html" class="enlace-volver">← Volver al test</a>
    </header>

    <div class="catalogo-titulo-wrap">
      <p class="catalogo-eyebrow" id="txt-eyebrow"></p>
      <h1 class="catalogo-titulo" id="txt-titulo"></h1>
      <p class="catalogo-sub" id="txt-sub"></p>
    </div>

    <!-- ============ PANEL DE AJUSTE GLOBAL ============ -->
    <section class="panel-ajuste-global">
      <div class="panel-fila">
        <div class="panel-campo">
          <label for="input-porcentaje">Ajustar todo el catálogo</label>
          <div class="panel-input-grupo">
            <select id="select-direccion" aria-label="Subir o bajar precio">
              <option value="subir">Subir</option>
              <option value="bajar">Bajar</option>
            </select>
            <input type="number" id="input-porcentaje" min="0" max="500" step="1" value="10" aria-label="Porcentaje de ajuste" />
            <span class="panel-simbolo">%</span>
            <button type="button" id="btn-aplicar-global" class="boton boton-primario">Aplicar a las 100</button>
          </div>
        </div>
        <button type="button" id="btn-reset-precios" class="boton boton-fantasma">↺ Restablecer precios originales</button>
      </div>
      <p class="panel-nota" id="panel-nota">Los precios se guardan automáticamente en este navegador y se usan también en los resultados del test.</p>
    </section>

    <!-- ============ FILTROS ============ -->
    <div class="filtros-barra">
      <button type="button" class="filtro-chip activo" data-filtro-tipo="Todos">Todos</button>
      <button type="button" class="filtro-chip" data-filtro-tipo="Diseñador">Diseñador</button>
      <button type="button" class="filtro-chip" data-filtro-tipo="Árabe">Árabe</button>
      <button type="button" class="filtro-chip" data-filtro-tipo="Lujo">Lujo</button>
      <span class="filtro-contador-activos" id="contador-activos"></span>
      <input type="search" id="input-buscar" class="filtro-buscar" placeholder="Buscar por nombre…" aria-label="Buscar perfume por nombre" />
    </div>

    <!-- ============ TABLA / GRID DE CATÁLOGO ============ -->
    <div id="grid-catalogo" class="grid-catalogo">
      <!-- Renderizado por JS -->
    </div>

  </div>

  <!-- Plantilla de fila de catálogo -->
  <template id="plantilla-fila-catalogo">
    <article class="fila-catalogo">
      <div class="fila-imagen-wrap">
        <img class="fila-imagen" data-campo="imagen" alt="" />
      </div>
      <div class="fila-info">
        <div class="fila-info-cabecera">
          <span class="fila-tipo" data-campo="tipo"></span>
          <span class="fila-id" data-campo="id"></span>
        </div>
        <h3 class="fila-nombre" data-campo="nombre"></h3>
        <p class="fila-notas" data-campo="notas"></p>
        <div class="fila-tags">
          <span class="fila-tag" data-campo="aroma"></span>
          <span class="fila-tag" data-campo="momento"></span>
          <span class="fila-tag" data-campo="clima"></span>
          <span class="fila-tag" data-campo="potencia"></span>
        </div>
        <div class="fila-imagen-subir-grupo">
          <label class="fila-imagen-subir-boton" data-campo="imagen-subir-label">
            📷 Subir foto
            <input type="file" accept="image/*" class="fila-imagen-subir-input" data-campo="imagen-subir-input" aria-label="Subir foto real del perfume" />
          </label>
          <button type="button" class="fila-imagen-quitar" data-campo="imagen-quitar" hidden>Quitar foto</button>
          <span class="fila-imagen-estado" data-campo="imagen-estado"></span>
        </div>
      </div>
      <div class="fila-precio-panel">
        <span class="fila-precio-etiqueta">Precio</span>
        <div class="fila-precio-input-grupo">
          <span class="fila-precio-signo">$</span>
          <input type="number" class="fila-precio-input" data-campo="precio-input" min="1" step="1" />
        </div>
        <span class="fila-precio-original" data-campo="precio-original"></span>
        <span class="fila-precio-categoria" data-campo="presupuesto"></span>
        <label class="fila-toggle-activo">
          <input type="checkbox" class="fila-toggle-input" data-campo="toggle-activo" />
          <span class="fila-toggle-slider"></span>
          <span class="fila-toggle-texto" data-campo="toggle-texto">Activo</span>
        </label>
      </div>
    </article>
  </template>

  <!-- data.js primero: db.js y auth-catalogo.js leen PERFUMES.
       db.js antes que los demás: define PerfumesDB, que ambos usan. -->
  <script src="data.js"></script>
  <script src="db.js"></script>
  <script src="auth-catalogo.js"></script>
  <script src="catalogo.js"></script>
</body>
</html>
